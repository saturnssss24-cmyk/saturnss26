<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATURN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
  :root {
    --noir: #000;
    --blanc: #f2f2f2;
    --gris: #8a8a8a;
    --surface: #141414;
    --ligne: #2a2a2a;
    --rouge: #8d0000;
    --bg-soft: #0d0d0d;
    color-scheme: dark;
    box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
  }

  html { scroll-behavior: smooth; scroll-padding-top: 16px; }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  body {
    background: var(--noir);
    color: var(--blanc);
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
    letter-spacing: .01em;
    min-height: 100vh;
  }

  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--blanc); outline-offset: 3px; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 18px;
    padding: 16px 24px;
    background: rgba(0, 0, 0, .88);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid rgba(255,255,255,.04);
  }

  header nav {
    grid-column: 2;
    display: flex;
    justify-content: center;
    gap: 20px;
    font-weight: 500;
    letter-spacing: .14em;
    text-transform: uppercase;
    font-size: 11px;
  }

  header nav a, .panier { color: var(--gris); transition: color .2s, opacity .2s; }
  header nav a:hover, .panier:hover { color: var(--blanc); }

  .logo {
    display: none;
  }

  .logo svg {
    display: block;
    width: 100%;
    height: 100%;
  }

  .panier {
    justify-self: end;
    background: none;
    border: 0;
    font: inherit;
    cursor: pointer;
    letter-spacing: .08em;
    text-transform: uppercase;
    font-size: 11px;
    white-space: nowrap;
  }

  main {
    width: min(1200px, calc(100% - 32px));
    margin: 0 auto;
  }

  .hero {
    min-height: 52vh;
    display: grid;
    place-content: center;
    text-align: center;
    padding: 24px 16px 20px;
  }

  .hero h1 {
    font-weight: 700;
    font-size: clamp(42px, 10vw, 140px);
    line-height: .92;
    letter-spacing: .18em;
    padding-left: .18em;
    text-transform: uppercase;
  }

  section { padding-bottom: 72px; }

  h2 {
    font-weight: 500;
    font-size: 12px;
    letter-spacing: .14em;
    text-transform: uppercase;
    color: var(--gris);
    padding: 0 0 20px;
  }

  .filtres {
    display: flex;
    flex-wrap: wrap;
    gap: 8px 24px;
    padding: 0 0 28px;
  }

  .filtres button {
    background: none;
    border: 0;
    border-bottom: 1px solid transparent;
    color: var(--gris);
    padding: 4px 0;
    font: inherit;
    font-size: 12px;
    letter-spacing: .1em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color .2s;
  }

  .filtres button:hover { color: var(--blanc); }
  .filtres button[aria-pressed="true"] {
    color: var(--blanc);
    border-bottom-color: var(--blanc);
  }

  .grille {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 32px 20px;
  }

  .photo {
    aspect-ratio: 4 / 5;
    background: var(--surface);
    border: 1px solid rgba(255,255,255,.03);
    transition: opacity .2s;
  }

  .produit h3 {
    font-weight: 500;
    font-size: 13px;
    margin-top: 14px;
    letter-spacing: .05em;
  }

  .produit span {
    display: block;
    color: var(--gris);
    font-size: 13px;
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 24px;
    padding: 24px 24px 42px;
    color: var(--gris);
    font-size: 12px;
    border-top: 1px solid rgba(255,255,255,.05);
  }

  footer a:hover { color: var(--blanc); }
  footer .reste { margin-left: auto; }

  [hidden] { display: none !important; }

  .ajout, .lien, .copier {
    background: none;
    border: 0;
    border-bottom: 1px solid var(--gris);
    color: var(--gris);
    font: inherit;
    font-size: 13px;
    padding: 0 0 2px;
    cursor: pointer;
    transition: color .2s, border-color .2s;
  }

  .ajout { margin-top: 8px; }
  .ajout:hover, .lien:hover, .copier:hover { color: var(--blanc); border-color: var(--blanc); }

  .voile {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, .6);
    z-index: 10;
  }

  .panneau {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, calc(100% - 12px));
    background: var(--noir);
    border-left: 1px solid var(--ligne);
    z-index: 11;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 20px 18px 28px;
  }

  .entete-panneau { display: flex; justify-content: space-between; align-items: baseline; }
  .entete-panneau h2 { padding: 0; }
  .ligne {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--ligne);
    font-size: 14px;
  }

  .vide { color: var(--gris); }
  .total { font-weight: 800; }
  .panneau label { display: grid; gap: 6px; color: var(--gris); font-size: 13px; }
  .panneau input {
    background: var(--surface);
    border: 1px solid var(--ligne);
    color: var(--blanc);
    padding: 12px;
    font: inherit;
    font-size: 16px;
  }

  .panneau input:focus-visible { outline: 2px solid var(--blanc); outline-offset: 2px; }
  .paiement { color: var(--gris); }
  .paiement strong { color: var(--blanc); font-weight: 400; }
  .bouton-plein {
    display: block;
    text-align: center;
    background: var(--blanc);
    color: var(--noir);
    padding: 14px;
    font-weight: 600;
  }
  .copier-wrap { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 10px 0; }
  .erreur { min-height: 1.5em; }

  @media (max-width: 560px) {
    header {
      grid-template-columns: 1fr auto;
      gap: 10px;
      padding: 14px 16px;
    }
    header nav {
      grid-column: 1 / -1;
      gap: 12px;
      letter-spacing: .08em;
      font-size: 9px;
    }
    .logo { width: 76px; height: 76px; }
    .panier { font-size: 9px; }
    main { width: min(100%, calc(100% - 20px)); }
    .hero { min-height: 42vh; }
    .grille { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    section { padding-bottom: 56px; }
    footer { padding: 20px 16px 28px; }
    .panneau { padding: 18px 16px 22px; }
  }

  @media (prefers-reduced-motion: reduce) {
    html { scroll-behavior: auto; }
    * { transition: none !important; }
  }
</style>
</head>
<body>

<header>
  <nav><a href="#collections">United Shop</a><a href="#un-sur-un">1 OF 1</a><a href="#contact">Contact</a></nav>
  <button class="panier" id="ouvrir-panier" type="button">Panier (0)</button>
</header>

<main>
  <section class="hero"><h1>SATURN</h1></section>

  <section id="collections">
    <h2>United Shop</h2>
    <div class="filtres" id="filtres"></div>
    <div class="grille" id="grille-collections"></div>
  </section>

  <section id="un-sur-un">
    <h2>1 OF 1</h2>
    <div class="grille" id="grille-1of1"></div>
  </section>
</main>

<footer id="contact">
  <span>© Saturn</span>
  <span>Orange Money Guinée</span>
  <a href="#">Instagram</a>
  <a href="#">Livraison et retours</a>
  <a href="#">Conditions de vente</a>
  <a class="reste" href="#">Nous écrire</a>
</footer>

<div class="voile" id="voile" hidden></div>
<aside class="panneau" id="panneau" role="dialog" aria-modal="true" aria-label="Panier" hidden>
  <div class="entete-panneau"><h2>Panier</h2><button type="button" class="lien" id="fermer">Fermer</button></div>
  <div id="liste-panier"></div>
  <p class="total" id="total-panier"></p>
  <label>Nom<input id="f-nom" autocomplete="name"></label>
  <label>Téléphone<input id="f-tel" type="tel" autocomplete="tel"></label>
  <label>Adresse de livraison<input id="f-adresse" autocomplete="street-address"></label>

  <div class="copier-wrap">
    <span>Orange Money</span>
    <button class="copier" type="button" id="copier-numero">Copier le n°</button>
  </div>

  <p class="paiement">Paiement par Orange Money. Envoie le total au <strong id="numero"></strong>, puis envoie ta commande.</p>
  <a class="bouton-plein" id="envoyer" target="_blank" rel="noopener">Envoyer ma commande</a>
  <p class="erreur" id="erreur" role="alert"></p>
</aside>

<script>
  const NUMERO = '224612690129';
  const formatNumero = value => '+' + value.replace(/(\d{3})(\d{3})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
  document.getElementById('numero').textContent = formatNumero(NUMERO);

  const collections = [
    { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 },
    { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 },
    { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 },
    { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 }
  ];

  const unSurUn = [
    { nom: '« NOM » TEE', prix: 0 },
    { nom: '« NOM » TEE', prix: 0 }
  ];
  unSurUn.forEach(p => p.unique = true);

  const gnf = n => (n ? n.toLocaleString('fr-FR').replace(/\s/g, ' ') + ' GNF' : '00 000 GNF');

  function afficher(liste, grille) {
    grille.innerHTML = '';
    liste.forEach(p => {
      const bloc = document.createElement('div');
      bloc.className = 'produit';
      bloc.innerHTML = '<div class="photo"></div><h3>' + p.nom + '</h3><span>' + gnf(p.prix) + '</span>';
      if (p.epuise) {
        bloc.insertAdjacentHTML('beforeend', '<span>Épuisé</span>');
      } else {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ajout';
        b.textContent = 'Ajouter au panier';
        b.addEventListener('click', () => ajouter(p));
        bloc.appendChild(b);
      }
      grille.appendChild(bloc);
    });
  }

  const grilleCollections = document.getElementById('grille-collections');
  const noms = ['Tout', ...new Set(collections.map(p => p.collection))];
  const zoneFiltres = document.getElementById('filtres');
  noms.forEach((nom, i) => {
    const b = document.createElement('button');
    b.textContent = nom;
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      zoneFiltres.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      afficher(nom === 'Tout' ? collections : collections.filter(p => p.collection === nom), grilleCollections);
    });
    zoneFiltres.appendChild(b);
  });

  const panier = [];
  const boutonPanier = document.getElementById('ouvrir-panier');
  const panneau = document.getElementById('panneau');
  const voile = document.getElementById('voile');
  const listePanier = document.getElementById('liste-panier');
  const totalPanier = document.getElementById('total-panier');
  const envoyer = document.getElementById('envoyer');
  const erreur = document.getElementById('erreur');
  const champs = [document.getElementById('f-nom'), document.getElementById('f-tel'), document.getElementById('f-adresse')];
  const copierNumeroBtn = document.getElementById('copier-numero');

  function ajouter(p) {
    const ligne = panier.find(l => l.p === p);
    if (!ligne) panier.push({ p: p, qte: 1 });
    else if (!p.unique) ligne.qte++;
    majPanier();
    ouvrir();
  }

  function retirer(i) { panier.splice(i, 1); majPanier(); }

  function message() {
    const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
    return 'Bonjour, je souhaite commander :\n' +
      panier.map(l => '- ' + l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix) + ')').join('\n') +
      '\nTotal : ' + gnf(total) + '\nPaiement : Orange Money' +
      '\nNom : ' + champs[0].value + '\nTéléphone : ' + champs[1].value + '\nAdresse : ' + champs[2].value;
  }

  function majPanier() {
    const nb = panier.reduce((s, l) => s + l.qte, 0);
    const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
    boutonPanier.textContent = 'Panier (' + nb + ')';
    totalPanier.textContent = 'Total : ' + gnf(total);
    document.getElementById('numero').textContent = formatNumero(NUMERO);
    listePanier.innerHTML = panier.length ? '' : '<p class="vide">Ton panier est vide.</p>';
    panier.forEach((l, i) => {
      const div = document.createElement('div');
      div.className = 'ligne';
      const texte = document.createElement('span');
      texte.textContent = l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix * l.qte) + ')';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lien';
      b.textContent = 'Retirer';
      b.addEventListener('click', () => retirer(i));
      div.append(texte, b);
      listePanier.appendChild(div);
    });
    envoyer.href = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(message());
  }

  function ouvrir() { panneau.hidden = false; voile.hidden = false; document.getElementById('fermer').focus(); }
  function fermer() { panneau.hidden = true; voile.hidden = true; boutonPanier.focus(); }
  boutonPanier.addEventListener('click', ouvrir);
  document.getElementById('fermer').addEventListener('click', fermer);
  voile.addEventListener('click', fermer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panneau.hidden) fermer(); });
  champs.forEach(c => c.addEventListener('input', majPanier));

  copierNumeroBtn.addEventListener('click', () => {
    navigator.clipboard.writeText(NUMERO).catch(() => {});
  });

  envoyer.addEventListener('click', e => {
    if (!panier.length) { e.preventDefault(); erreur.textContent = 'Ton panier est vide.'; }
    else if (champs.some(c => !c.value.trim())) { e.preventDefault(); erreur.textContent = 'Remplis ton nom, ton téléphone et ton adresse.'; }
    else erreur.textContent = '';
  });

  afficher(collections, grilleCollections);
  afficher(unSurUn, document.getElementById('grille-1of1'));
  majPanier();
</script>
</body>
</html>
