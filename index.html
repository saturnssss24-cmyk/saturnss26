<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATURN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;800&display=swap" rel="stylesheet">
<style>
  /* 1. Couleurs de la marque : change-les ici, elles s’appliquent partout */
  :root {
    --noir: #000; --blanc: #f2f2f2; --gris: #8a8a8a; --surface: #141414; --ligne: #2a2a2a;
    color-scheme: dark; box-sizing: border-box;
    padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px);
  }
  html { scroll-padding-top: env(safe-area-inset-top, 0px); scroll-behavior: smooth; }
  *, *::before, *::after { box-sizing: inherit; margin: 0; }
  body { background: var(--noir); color: var(--blanc); font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif; line-height: 1.5; }
  a { color: inherit; text-decoration: none; }
  a:focus-visible, button:focus-visible { outline: 2px solid var(--blanc); outline-offset: 4px; }

  /* 2. En-tête : menu à gauche, logo au centre, panier à droite */
  header { display: grid; grid-template-columns: 1fr auto 1fr; align-items: center; padding: 24px 32px; font-size: 13px; }
  header nav { display: flex; gap: 24px; }
  header nav a, .panier { color: var(--gris); transition: color .2s; }
  header nav a:hover, .panier:hover { color: var(--blanc); }
  .logo { line-height: 0; }
  .logo img { display: block; height: 52px; width: auto; }
  .panier { justify-self: end; background: none; border: 0; font: inherit; cursor: pointer; }

  /* 3. Grand nom de la marque */
  .hero { min-height: 60vh; display: grid; place-content: center; padding: 48px 24px; text-align: center; }
  .hero h1 { font-weight: 400; font-size: clamp(40px, 12vw, 160px); line-height: 1; letter-spacing: 0.2em; padding-left: 0.2em; }

  /* 4. Sections (Collections, 1 OF 1) */
  section { padding-bottom: 96px; }
  h2 { font-weight: 400; font-size: 13px; color: var(--gris); padding: 0 32px 24px; }
  .filtres { display: flex; flex-wrap: wrap; gap: 8px 28px; padding: 0 32px 40px; }
  .filtres button { background: none; border: 0; border-bottom: 1px solid transparent; color: var(--gris); padding: 4px 0; font: inherit; font-size: 13px; cursor: pointer; transition: color .2s; }
  .filtres button:hover { color: var(--blanc); }
  .filtres button[aria-pressed="true"] { color: var(--blanc); border-bottom-color: var(--blanc); }

  /* 5. Grille de produits */
  .grille { display: grid; grid-template-columns: repeat(auto-fill, minmax(240px, 1fr)); gap: 40px 24px; padding: 0 32px; }
  .photo { aspect-ratio: 4 / 5; background: var(--surface); transition: opacity .2s; }
  .produit h3 { font-weight: 400; font-size: 13px; margin-top: 14px; }
  .produit span { display: block; color: var(--gris); font-size: 13px; }

  /* 6. Pied de page */
  footer { padding: 32px; display: flex; flex-wrap: wrap; gap: 12px 28px; color: var(--gris); font-size: 12px; }
  footer a:hover { color: var(--blanc); }
  footer .reste { margin-left: auto; }
  /* 7. Panier et commande */
  [hidden] { display: none !important; }
  .ajout, .lien { background: none; border: 0; border-bottom: 1px solid var(--gris); color: var(--gris); font: inherit; font-size: 13px; padding: 0 0 2px; cursor: pointer; transition: color .2s, border-color .2s; }
  .ajout { margin-top: 8px; }
  .ajout:hover, .lien:hover { color: var(--blanc); border-color: var(--blanc); }
  .voile { position: fixed; inset: 0; background: rgba(0, 0, 0, .6); z-index: 10; }
  .panneau { position: fixed; top: 0; right: 0; bottom: 0; width: min(420px, 100%); background: var(--noir); border-left: 1px solid var(--ligne); z-index: 11; overflow-y: auto; display: flex; flex-direction: column; gap: 16px; padding: calc(24px + env(safe-area-inset-top, 0px)) 24px calc(24px + env(safe-area-inset-bottom, 0px)); font-size: 14px; }
  .entete-panneau { display: flex; justify-content: space-between; align-items: baseline; }
  .entete-panneau h2 { padding: 0; }
  .ligne { display: flex; justify-content: space-between; gap: 16px; padding: 12px 0; border-bottom: 1px solid var(--ligne); }
  .vide { color: var(--gris); }
  .total { font-weight: 800; }
  .panneau label { display: grid; gap: 6px; color: var(--gris); font-size: 13px; }
  .panneau input { background: var(--surface); border: 1px solid var(--ligne); color: var(--blanc); padding: 12px; font: inherit; font-size: 16px; }
  .panneau input:focus-visible { outline: 2px solid var(--blanc); outline-offset: 2px; }
  .paiement { color: var(--gris); }
  .paiement strong { color: var(--blanc); font-weight: 400; }
  .bouton-plein { display: block; text-align: center; background: var(--blanc); color: var(--noir); padding: 14px; }
  .erreur { min-height: 1.5em; }
  @media (max-width: 560px) {
    header { grid-template-columns: auto 1fr auto; gap: 12px; padding: 16px; }
    .logo { order: -1; }
    .logo img { height: 40px; }
    header nav { justify-content: center; gap: 14px; }
  }
  @media (prefers-reduced-motion: reduce) { html { scroll-behavior: auto; } * { transition: none !important; } }
</style>
</head>

  <button class="panier" id="ouvrir-panier" type="button">Panier (0)</button>
</header>

<main>
  <section class="hero"><h1>SATURN</h1></section>

  <section id="collections">
    <h2>Collections</h2>
    <div class="filtres" id="filtres"></div>
    <div class="grille" id="grille-collections"></div>
  </section>

  <section id="un-sur-un">
    <h2>1 OF 1</h2>
    <div class="grille" id="grille-1of1"></div>
  </section>
</main>

<footer id="contact">
  <span>© Saturn</span>
  <span>Paiement par Orange Money</span>
  <a href="#">Instagram</a>
  <a href="#">Livraison et retours</a>
  <a href="#">Conditions de vente</a>
  <a class="reste" href="#">Nous écrire</a>
</footer>

<div class="voile" id="voile" hidden></div>
<aside class="panneau" id="panneau" role="dialog" aria-modal="true" aria-label="Panier" hidden>
  <div class="entete-panneau"><h2>Panier</h2><button type="button" class="lien" id="fermer">Fermer</button></div>
  <div id="liste-panier"></div>
  <p class="total" id="total-panier"></p>
  <label>Nom<input id="f-nom" autocomplete="name"></label>
  <label>Téléphone<input id="f-tel" type="tel" autocomplete="tel"></label>
  <label>Adresse de livraison<input id="f-adresse" autocomplete="street-address"></label>
  <p class="paiement">Paiement par Orange Money. Envoie le total au <strong id="numero"></strong>, puis envoie ta commande.</p>
  <a class="bouton-plein" id="envoyer" target="_blank" rel="noopener">Envoyer ma commande</a>
  <p class="erreur" id="erreur" role="alert"></p>
</aside>

<script>
  // 8. Le numéro qui reçoit toutes les commandes (format international, sans le +)
  const NUMERO = '224612690129';
  document.getElementById('numero').textContent = '+' + NUMERO.replace(/(\d{3})(\d{3})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');

  // 9. Tes t-shirts de la section Collections.
  // Pour en ajouter un : copie une ligne et change le nom, la collection et le prix.
  // prix = le montant en GNF, juste le chiffre (exemple : 150000). Avec 0, la page affiche « 00 000 GNF ».
  // Les boutons de filtre se créent tout seuls à partir des noms de collection.
  // epuise: true affiche « Épuisé ».
  const collections = [
    { nom: '« NOM » TEE', collection: 'Collection 1', prix: 0 },
    { nom: '« NOM » TEE', collection: 'Collection 1', prix: 0 },
    { nom: '« NOM » TEE', collection: 'Collection 2', prix: 0, epuise: true },
    { nom: '« NOM » TEE', collection: 'Collection 2', prix: 0 }
  ];

  // 10. Tes pièces uniques (1 OF 1) : même principe
  const unSurUn = [
    { nom: '« NOM » TEE', prix: 0 },
    { nom: '« NOM » TEE', prix: 0 }
  ];
  unSurUn.forEach(p => p.unique = true); // une pièce unique ne se commande qu’une fois

  // 11. Écrire un prix : 150000 devient « 150 000 GNF »
  const gnf = n => (n ? n.toLocaleString('fr-FR').replace(/\s/g, ' ') + ' GNF' : '00 000 GNF');

  // 12. Affiche une liste de produits dans une grille
  function afficher(liste, grille) {
    grille.innerHTML = '';
    liste.forEach(p => {
      const bloc = document.createElement('div');
      bloc.className = 'produit';
      bloc.innerHTML = '<div class="photo"></div><h3>' + p.nom + '</h3><span>' + gnf(p.prix) + '</span>';
      if (p.epuise) {
        bloc.insertAdjacentHTML('beforeend', '<span>Épuisé</span>');
      } else {
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'ajout';
        b.textContent = 'Ajouter au panier';
        b.addEventListener('click', () => ajouter(p));
        bloc.appendChild(b);
      }
      grille.appendChild(bloc);
    });
  }

  // 13. Les boutons de filtre : « Tout » + une entrée par collection
  const grilleCollections = document.getElementById('grille-collections');
  const noms = ['Tout', ...new Set(collections.map(p => p.collection))];
  const zoneFiltres = document.getElementById('filtres');
  noms.forEach((nom, i) => {
    const b = document.createElement('button');
    b.textContent = nom;
    b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
    b.addEventListener('click', () => {
      zoneFiltres.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
      afficher(nom === 'Tout' ? collections : collections.filter(p => p.collection === nom), grilleCollections);
    });
    zoneFiltres.appendChild(b);
  });

  // 14. Le panier : chaque ligne = { p: produit, qte: quantité }
  const panier = [];
  const boutonPanier = document.getElementById('ouvrir-panier');
  const panneau = document.getElementById('panneau');
  const voile = document.getElementById('voile');
  const listePanier = document.getElementById('liste-panier');
  const totalPanier = document.getElementById('total-panier');
  const envoyer = document.getElementById('envoyer');
  const erreur = document.getElementById('erreur');
  const champs = [document.getElementById('f-nom'), document.getElementById('f-tel'), document.getElementById('f-adresse')];

  function ajouter(p) {
    const ligne = panier.find(l => l.p === p);
    if (!ligne) panier.push({ p: p, qte: 1 });
    else if (!p.unique) ligne.qte++;
    majPanier();
    ouvrir();
  }

  function retirer(i) { panier.splice(i, 1); majPanier(); }

  // 15. Le message envoyé sur WhatsApp au numéro de la boutique
  function message() {
    const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
    return 'Bonjour, je souhaite commander :\n' +
      panier.map(l => '- ' + l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix) + ')').join('\n') +
      '\nTotal : ' + gnf(total) + '\nPaiement : Orange Money' +
      '\nNom : ' + champs[0].value + '\nTéléphone : ' + champs[1].value + '\nAdresse : ' + champs[2].value;
  }

  function majPanier() {
    const nb = panier.reduce((s, l) => s + l.qte, 0);
    const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
    boutonPanier.textContent = 'Panier (' + nb + ')';
    totalPanier.textContent = 'Total : ' + gnf(total);
    listePanier.innerHTML = panier.length ? '' : '<p class="vide">Ton panier est vide.</p>';
    panier.forEach((l, i) => {
      const div = document.createElement('div');
      div.className = 'ligne';
      const texte = document.createElement('span');
      texte.textContent = l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix * l.qte) + ')';
      const b = document.createElement('button');
      b.type = 'button';
      b.className = 'lien';
      b.textContent = 'Retirer';
      b.addEventListener('click', () => retirer(i));
      div.append(texte, b);
      listePanier.appendChild(div);
    });
    envoyer.href = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(message());
  }

  function ouvrir() { panneau.hidden = false; voile.hidden = false; document.getElementById('fermer').focus(); }
  function fermer() { panneau.hidden = true; voile.hidden = true; boutonPanier.focus(); }
  boutonPanier.addEventListener('click', ouvrir);
  document.getElementById('fermer').addEventListener('click', fermer);
  voile.addEventListener('click', fermer);
  document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panneau.hidden) fermer(); });
  champs.forEach(c => c.addEventListener('input', majPanier));

  // 16. On vérifie que tout est rempli avant d'ouvrir WhatsApp
  envoyer.addEventListener('click', e => {
    if (!panier.length) { e.preventDefault(); erreur.textContent = 'Ton panier est vide.'; }
    else if (champs.some(c => !c.value.trim())) { e.preventDefault(); erreur.textContent = 'Remplis ton nom, ton téléphone et ton adresse.'; }
    else erreur.textContent = '';
  });

  afficher(collections, grilleCollections);
  afficher(unSurUn, document.getElementById('grille-1of1'));
  majPanier();
</script>
</body>
</html>
