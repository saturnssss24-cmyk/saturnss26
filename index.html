<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>SATURN</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&display=swap" rel="stylesheet">
<style>
  :root {
    --bg: #050505;
    --bg-soft: #0d0d0d;
    --panel: #111111;
    --panel-2: #171717;
    --line: rgba(255,255,255,.08);
    --line-strong: rgba(255,255,255,.14);
    --text: #f5f5f5;
    --muted: #b0b0b0;
    --muted-2: #7a7a7a;
    --shadow: 0 18px 40px rgba(0,0,0,.28);
    color-scheme: dark;
  }

  * { box-sizing: border-box; }
  html { scroll-behavior: smooth; scroll-padding-top: 18px; }
  body {
    margin: 0;
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: 'Archivo', 'Helvetica Neue', Arial, sans-serif;
    line-height: 1.5;
    letter-spacing: .02em;
  }

  a { color: inherit; text-decoration: none; }
  button, input { font: inherit; }
  a:focus-visible, button:focus-visible, input:focus-visible { outline: 2px solid var(--text); outline-offset: 3px; }

  .page-shell { width: min(1240px, calc(100% - 32px)); margin: 0 auto; }

  header {
    position: sticky;
    top: 0;
    z-index: 20;
    background: rgba(5,5,5,.78);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid var(--line);
  }

  .header-inner {
    min-height: 72px;
    display: grid;
    grid-template-columns: 1fr auto auto;
    align-items: center;
    gap: 18px;
  }

  .brand {
    font-size: 11px;
    letter-spacing: .22em;
    text-transform: uppercase;
    font-weight: 700;
    color: var(--text);
    white-space: nowrap;
  }

  nav {
    display: flex;
    justify-content: center;
    gap: 26px;
    align-items: center;
  }

  nav a {
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
    transition: color .2s ease;
  }

  nav a:hover { color: var(--text); }

  .panier {
    justify-self: end;
    background: none;
    border: 1px solid var(--line-strong);
    color: var(--text);
    padding: 9px 12px;
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .2s ease, background .2s ease;
  }

  .panier:hover {
    background: rgba(255,255,255,.03);
    border-color: rgba(255,255,255,.22);
  }

  main { padding: 30px 0 54px; }

  .hero {
    min-height: 52vh;
    display: grid;
    place-items: center;
    text-align: center;
    padding: 20px 0 24px;
    border-bottom: 1px solid var(--line);
  }

  .hero h1 {
    margin: 0;
    font-size: clamp(64px, 10vw, 170px);
    line-height: .82;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 900;
    color: var(--text);
  }

  .hero .sub {
    margin-top: 12px;
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .22em;
    text-transform: uppercase;
  }

  section { padding: 26px 0 38px; }

  .section-head {
    display: flex;
    align-items: flex-end;
    justify-content: space-between;
    gap: 16px;
    padding-bottom: 18px;
    border-bottom: 1px solid var(--line);
    margin-bottom: 24px;
  }

  .section-head h2 {
    margin: 0;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
    font-weight: 600;
  }

  .section-head .meta {
    color: var(--muted-2);
    font-size: 10px;
    letter-spacing: .18em;
    text-transform: uppercase;
  }

  .filters {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 20px;
    padding: 0 0 24px;
  }

  .filters button {
    background: none;
    border: 0;
    border-bottom: 1px solid transparent;
    color: var(--muted);
    padding: 6px 0;
    font-size: 11px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: color .2s ease, border-color .2s ease;
  }

  .filters button:hover { color: var(--text); }
  .filters button[aria-pressed="true"] {
    color: var(--text);
    border-bottom-color: var(--text);
  }

  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(220px, 1fr));
    gap: 28px 20px;
  }

  .product {
    display: flex;
    flex-direction: column;
    gap: 12px;
  }

  .product-art {
    aspect-ratio: 4 / 5;
    background: linear-gradient(180deg, #121212 0%, #0b0b0b 100%);
    border: 1px solid var(--line);
    box-shadow: var(--shadow);
    position: relative;
    overflow: hidden;
  }

  .product-art::before {
    content: "";
    position: absolute;
    inset: 14px;
    border: 1px solid rgba(255,255,255,.06);
  }

  .product-art::after {
    content: "";
    position: absolute;
    right: 18px;
    bottom: 18px;
    width: 32px;
    height: 32px;
    border: 1px solid rgba(255,255,255,.12);
    transform: rotate(45deg);
  }

  .product h3 {
    margin: 0;
    font-size: 12px;
    letter-spacing: .12em;
    text-transform: uppercase;
    font-weight: 600;
  }

  .product .price {
    display: block;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .12em;
    text-transform: uppercase;
  }

  .product button,
  .mini-button {
    background: none;
    border: 0;
    border-bottom: 1px solid var(--muted-2);
    color: var(--text);
    padding: 0 0 4px;
    width: fit-content;
    font-size: 10px;
    letter-spacing: .16em;
    text-transform: uppercase;
    cursor: pointer;
    transition: border-color .2s ease, color .2s ease;
  }

  .product button:hover,
  .mini-button:hover {
    color: var(--text);
    border-color: var(--text);
  }

  footer {
    display: flex;
    flex-wrap: wrap;
    gap: 12px 22px;
    padding: 24px 0 36px;
    border-top: 1px solid var(--line);
    color: var(--muted);
    font-size: 10px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  footer .push { margin-left: auto; }

  [hidden] { display: none !important; }

  .overlay {
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.72);
    z-index: 30;
  }

  .panel {
    position: fixed;
    top: 0;
    right: 0;
    bottom: 0;
    width: min(420px, calc(100% - 12px));
    background: rgba(10,10,10,.98);
    border-left: 1px solid var(--line);
    z-index: 31;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 18px;
    padding: 22px 18px 26px;
  }

  .panel-head {
    display: flex;
    justify-content: space-between;
    align-items: center;
  }

  .panel-head h2 {
    margin: 0;
    font-size: 12px;
    letter-spacing: .18em;
    text-transform: uppercase;
    color: var(--muted);
  }

  .line {
    display: flex;
    justify-content: space-between;
    gap: 16px;
    padding: 12px 0;
    border-bottom: 1px solid var(--line);
    font-size: 13px;
  }

  .empty { color: var(--muted); }
  .total { font-weight: 800; }
  .panel label {
    display: grid;
    gap: 8px;
    color: var(--muted);
    font-size: 11px;
    letter-spacing: .14em;
    text-transform: uppercase;
  }

  .panel input {
    background: var(--panel-2);
    border: 1px solid var(--line);
    color: var(--text);
    padding: 12px 14px;
    font-size: 16px;
    border-radius: 8px;
  }

  .payment-box {
    display: flex;
    justify-content: space-between;
    align-items: center;
    gap: 10px;
    padding: 8px 0;
  }

  .payment-box span,
  .payment-text { color: var(--muted); }

  .payment-text strong { color: var(--text); font-weight: 600; }

  .cta {
    display: block;
    width: 100%;
    text-align: center;
    background: var(--text);
    color: var(--bg);
    padding: 14px 16px;
    font-size: 11px;
    letter-spacing: .18em;
    text-transform: uppercase;
    font-weight: 700;
    border-radius: 999px;
  }

  .error { min-height: 1.5em; color: #ffb3b3; }

  @media (max-width: 640px) {
    .header-inner {
      grid-template-columns: 1fr auto;
      gap: 10px;
      min-height: 72px;
    }

    nav {
      grid-column: 1 / -1;
      justify-content: center;
      flex-wrap: wrap;
      gap: 8px 14px;
    }

    nav a { font-size: 8px; letter-spacing: .12em; }
    .brand { font-size: 9px; letter-spacing: .16em; }
    .panier { font-size: 8px; letter-spacing: .12em; }
    .hero h1 { letter-spacing: .08em; }
    .grid { grid-template-columns: repeat(2, minmax(0, 1fr)); }
    .panel { padding: 18px 14px 22px; }
  }
</style>
</head>
<body>
  <header>
    <div class="page-shell header-inner">
      <div class="brand">SATURN</div>
      <nav aria-label="Navigation principale">
        <a href="#collections">United Shop</a>
        <a href="#un-sur-un">1 of 1</a>
        <a href="https://instagram.com/saturnss.26" target="_blank" rel="noopener noreferrer">Instagram</a>
      </nav>
      <button class="panier" id="ouvrir-panier" type="button">Panier (0)</button>
    </div>
  </header>

  <main class="page-shell">
    <section class="hero">
      <div>
        <h1>SATURN</h1>
      </div>
    </section>

    <section id="collections">
      <div class="section-head">
        <h2>United Shop</h2>
        <span class="meta">Collection archive</span>
      </div>
      <div class="filters" id="filtres"></div>
      <div class="grid" id="grille-collections"></div>
    </section>

    <section id="un-sur-un">
      <div class="section-head">
        <h2>1 Of 1</h2>
        <span class="meta">Unique pieces</span>
      </div>
      <div class="grid" id="grille-1of1"></div>
    </section>
  </main>

  <footer id="contact" class="page-shell">
    <span>© Saturn</span>
    <a href="https://instagram.com/saturnss.26" target="_blank" rel="noopener noreferrer">Instagram</a>
  </footer>

  <div class="overlay" id="voile" hidden></div>
  <aside class="panel" id="panneau" role="dialog" aria-modal="true" aria-label="Panier" hidden>
    <div class="panel-head">
      <h2>Panier</h2>
      <button type="button" class="mini-button" id="fermer">Fermer</button>
    </div>
    <div id="liste-panier"></div>
    <p class="total" id="total-panier"></p>
    <label>Nom<input id="f-nom" autocomplete="name"></label>
    <label>Téléphone<input id="f-tel" type="tel" autocomplete="tel"></label>
    <label>Adresse de livraison<input id="f-adresse" autocomplete="street-address"></label>

    <div class="payment-box">
      <span>Orange Money</span>
      <button class="mini-button" type="button" id="copier-numero">Copier le n°</button>
    </div>

    <p class="payment-text">Paiement par Orange Money. Envoie le total au <strong id="numero"></strong>, puis envoie ta commande.</p>
    <a class="cta" id="envoyer" target="_blank" rel="noopener">Envoyer ma commande</a>
    <p class="error" id="erreur" role="alert"></p>
  </aside>

  <script>
    const NUMERO = '224612690129';
    const formatNumero = value => '+' + value.replace(/(\d{3})(\d{3})(\d{2})(\d{2})(\d{2})/, '$1 $2 $3 $4 $5');
    document.getElementById('numero').textContent = formatNumero(NUMERO);

    const collections = [
      { nom: 'SATURN TEE', collection: 'United Shop', prix: 0 },
      { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 },
      { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 },
      { nom: '« NOM » TEE', collection: 'United Shop', prix: 0 }
    ];

    const unSurUn = [
      { nom: '« NOM » TEE', prix: 0 },
      { nom: '« NOM » TEE', prix: 0 }
    ];
    unSurUn.forEach(p => p.unique = true);

    const gnf = n => (n ? n.toLocaleString('fr-FR').replace(/\s/g, ' ') + ' GNF' : '00 000 GNF');

    function afficher(liste, grille) {
      grille.innerHTML = '';
      liste.forEach(p => {
        const bloc = document.createElement('div');
        bloc.className = 'product';
        bloc.innerHTML = '<div class="product-art"></div><h3>' + p.nom + '</h3><span class="price">' + gnf(p.prix) + '</span>';
        if (p.epuise) {
          bloc.insertAdjacentHTML('beforeend', '<span class="price">Épuisé</span>');
        } else {
          const b = document.createElement('button');
          b.type = 'button';
          b.textContent = 'Ajouter au panier';
          b.addEventListener('click', () => ajouter(p));
          bloc.appendChild(b);
        }
        grille.appendChild(bloc);
      });
    }

    const grilleCollections = document.getElementById('grille-collections');
    const noms = ['Tout', ...new Set(collections.map(p => p.collection))];
    const zoneFiltres = document.getElementById('filtres');
    noms.forEach((nom, i) => {
      const b = document.createElement('button');
      b.textContent = nom;
      b.setAttribute('aria-pressed', i === 0 ? 'true' : 'false');
      b.addEventListener('click', () => {
        zoneFiltres.querySelectorAll('button').forEach(x => x.setAttribute('aria-pressed', x === b ? 'true' : 'false'));
        afficher(nom === 'Tout' ? collections : collections.filter(p => p.collection === nom), grilleCollections);
      });
      zoneFiltres.appendChild(b);
    });

    const panier = [];
    const boutonPanier = document.getElementById('ouvrir-panier');
    const panneau = document.getElementById('panneau');
    const voile = document.getElementById('voile');
    const listePanier = document.getElementById('liste-panier');
    const totalPanier = document.getElementById('total-panier');
    const envoyer = document.getElementById('envoyer');
    const erreur = document.getElementById('erreur');
    const champs = [document.getElementById('f-nom'), document.getElementById('f-tel'), document.getElementById('f-adresse')];
    const copierNumeroBtn = document.getElementById('copier-numero');

    function ajouter(p) {
      const ligne = panier.find(l => l.p === p);
      if (!ligne) panier.push({ p: p, qte: 1 });
      else if (!p.unique) ligne.qte++;
      majPanier();
      ouvrir();
    }

    function retirer(i) { panier.splice(i, 1); majPanier(); }

    function message() {
      const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
      return 'Bonjour, je souhaite commander :\n' +
        panier.map(l => '- ' + l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix) + ')').join('\n') +
        '\nTotal : ' + gnf(total) + '\nPaiement : Orange Money' +
        '\nNom : ' + champs[0].value + '\nTéléphone : ' + champs[1].value + '\nAdresse : ' + champs[2].value;
    }

    function majPanier() {
      const nb = panier.reduce((s, l) => s + l.qte, 0);
      const total = panier.reduce((s, l) => s + l.p.prix * l.qte, 0);
      boutonPanier.textContent = 'Panier (' + nb + ')';
      totalPanier.textContent = 'Total : ' + gnf(total);
      document.getElementById('numero').textContent = formatNumero(NUMERO);
      listePanier.innerHTML = panier.length ? '' : '<p class="empty">Ton panier est vide.</p>';
      panier.forEach((l, i) => {
        const div = document.createElement('div');
        div.className = 'line';
        const texte = document.createElement('span');
        texte.textContent = l.qte + ' × ' + l.p.nom + ' (' + gnf(l.p.prix * l.qte) + ')';
        const b = document.createElement('button');
        b.type = 'button';
        b.className = 'mini-button';
        b.textContent = 'Retirer';
        b.addEventListener('click', () => retirer(i));
        div.append(texte, b);
        listePanier.appendChild(div);
      });
      envoyer.href = 'https://wa.me/' + NUMERO + '?text=' + encodeURIComponent(message());
    }

    function ouvrir() { panneau.hidden = false; voile.hidden = false; document.getElementById('fermer').focus(); }
    function fermer() { panneau.hidden = true; voile.hidden = true; boutonPanier.focus(); }
    boutonPanier.addEventListener('click', ouvrir);
    document.getElementById('fermer').addEventListener('click', fermer);
    voile.addEventListener('click', fermer);
    document.addEventListener('keydown', e => { if (e.key === 'Escape' && !panneau.hidden) fermer(); });
    champs.forEach(c => c.addEventListener('input', majPanier));

    copierNumeroBtn.addEventListener('click', () => {
      navigator.clipboard.writeText(NUMERO).catch(() => {});
    });

    envoyer.addEventListener('click', e => {
      if (!panier.length) { e.preventDefault(); erreur.textContent = 'Ton panier est vide.'; }
      else if (champs.some(c => !c.value.trim())) { e.preventDefault(); erreur.textContent = 'Remplis ton nom, ton téléphone et ton adresse.'; }
      else erreur.textContent = '';
    });

    afficher(collections, grilleCollections);
    afficher(unSurUn, document.getElementById('grille-1of1'));
    majPanier();
  </script>
</body>
</html>
